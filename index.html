<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beth</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper: #f5f0e8;
    --paper-dark: #ede7d9;
    --ink: #1a1a18;
    --tape:      rgba(180, 210, 190, 0.55);
    --tape-blue: rgba(160, 185, 220, 0.50);
    --tape-pink: rgba(220, 175, 175, 0.50);
  }

  body {
    background: #1c1c1a;
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    overflow-x: hidden;
  }

  header {
    position: relative;
    z-index: 10;
    padding: 2.5rem 3rem 0;
    display: flex;
    align-items: baseline;
    gap: 1.4rem;
  }

  .site-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.8rem;
    font-weight: 600;
    color: var(--paper);
    letter-spacing: 0.04em;
    line-height: 1;
  }

  .site-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1rem;
    color: #555;
    letter-spacing: 0.06em;
    padding-bottom: 4px;
  }

  nav {
    position: relative;
    z-index: 10;
    padding: 1.4rem 3rem 0;
    display: flex;
    gap: 0;
  }

  nav button {
    background: none;
    border: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: #555;
    cursor: pointer;
    padding: 6px 22px 6px 0;
    position: relative;
    transition: color 0.2s;
  }

  nav button::after {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 0;
    right: 22px;
    height: 1px;
    background: var(--paper);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s ease;
  }

  nav button.active { color: var(--paper); }
  nav button.active::after { transform: scaleX(1); }
  nav button:hover:not(.active) { color: #999; }

  .board {
    position: relative;
    z-index: 5;
    padding: 2.5rem 2rem 4rem;
    min-height: calc(100vh - 160px);
  }

  .tab-content { display: none; animation: fadeIn 0.35s ease; }
  .tab-content.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .trip-section { margin-bottom: 3.5rem; }

  .trip-label {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.9rem;
    color: #555;
    letter-spacing: 0.1em;
    text-transform: lowercase;
    margin-bottom: 1.4rem;
    padding-left: 0.5rem;
  }

  .polaroid-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    align-items: flex-start;
  }

  /* Polaroid — horizontal 5:3 photo area */
  .polaroid {
    background: white;
    padding: 9px 9px 40px;
    position: relative;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    flex-shrink: 0;
  }

  .polaroid:hover { z-index: 20; box-shadow: 0 14px 44px rgba(0,0,0,0.65); }

  .polaroid .photo {
    width: 100%;
    /* 5:3 ratio */
    aspect-ratio: 5 / 3;
    overflow: hidden;
    background: var(--paper-dark);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .polaroid .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .polaroid .photo.placeholder {
    background: linear-gradient(135deg, #2a2a28 0%, #3a3830 100%);
  }

  /* Location + date caption */
  .polaroid .caption {
    position: absolute;
    bottom: 0;
    left: 9px;
    right: 9px;
    height: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
  }

  .polaroid .caption .loc {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: #222;
    letter-spacing: 0.04em;
    line-height: 1.2;
  }

  .polaroid .caption .when {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.75rem;
    color: #888;
    letter-spacing: 0.03em;
    line-height: 1.2;
  }

  /* Tape */
  .tape {
    position: absolute;
    height: 20px;
    width: 50px;
    z-index: 2;
    border-radius: 1px;
  }
  .tape-top { top: -9px; left: 50%; transform: translateX(-50%) rotate(-1deg); }
  .tape-tl  { top: -8px; left: 14px; transform: rotate(-7deg); }
  .tape-tr  { top: -8px; right: 14px; transform: rotate(5deg); }
  .tape-green { background: var(--tape); }
  .tape-blue  { background: var(--tape-blue); }
  .tape-pink  { background: var(--tape-pink); }

  /* Width variants — wider to match 5:3 ratio nicely */
  .pol-sm { width: 220px; }
  .pol-md { width: 270px; }
  .pol-lg { width: 320px; }

  /* Rotations */
  .rot-m3 { transform: rotate(-3deg); }
  .rot-m2 { transform: rotate(-2deg); }
  .rot-m1 { transform: rotate(-1.2deg); }
  .rot-0  { transform: rotate(0deg); }
  .rot-1  { transform: rotate(1.2deg); }
  .rot-2  { transform: rotate(2.2deg); }
  .rot-3  { transform: rotate(3.5deg); }

  .rot-m3:hover { transform: rotate(-3deg) scale(1.05) translateY(-4px); }
  .rot-m2:hover { transform: rotate(-2deg) scale(1.05) translateY(-4px); }
  .rot-m1:hover { transform: rotate(-1.2deg) scale(1.05) translateY(-4px); }
  .rot-0:hover  { transform: rotate(0deg) scale(1.05) translateY(-4px); }
  .rot-1:hover  { transform: rotate(1.2deg) scale(1.05) translateY(-4px); }
  .rot-2:hover  { transform: rotate(2.2deg) scale(1.05) translateY(-4px); }
  .rot-3:hover  { transform: rotate(3.5deg) scale(1.05) translateY(-4px); }

  .mt-0 { margin-top: 0; }
  .mt-1 { margin-top: 20px; }
  .mt-2 { margin-top: 40px; }
  .ml-1 { margin-left: 14px; }
  .ml-2 { margin-left: 28px; }
  .ml-3 { margin-left: 44px; }

  .divider {
    border: none;
    border-top: 1px dashed #2e2e2c;
    margin: 0.5rem 0 2.5rem 0.5rem;
    width: 100px;
  }

  .upload-hint {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.85rem;
    color: #333;
    letter-spacing: 0.05em;
    padding: 2.5rem 0 1rem 0.5rem;
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,10,8,0.93);
    z-index: 100;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .lightbox.open { display: flex; animation: lbIn 0.2s ease; }
  @keyframes lbIn { from { opacity: 0; } to { opacity: 1; } }

  .lightbox-inner {
    background: white;
    padding: 10px 10px 52px;
    position: relative;
    cursor: default;
    max-width: 90vw;
  }

  .lightbox-inner img {
    display: block;
    max-width: 80vw;
    max-height: 70vh;
    object-fit: contain;
  }

  .lightbox-inner .photo.placeholder {
    width: 600px;
    max-width: 80vw;
    height: 360px;
    max-height: 70vh;
    background: linear-gradient(135deg, #2a2a28, #3a3830);
  }

  .lightbox-caption {
    position: absolute;
    bottom: 0;
    left: 10px;
    right: 10px;
    height: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .lightbox-caption .loc {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    font-weight: 600;
    color: #222;
    letter-spacing: 0.04em;
  }

  .lightbox-caption .when {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.85rem;
    color: #888;
  }

  .lightbox-close {
    position: absolute;
    top: -30px;
    right: 0;
    background: none;
    border: none;
    color: #888;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="site-name">Beth</div>
  <div class="site-tagline">photography</div>
</header>

<nav>
  <button class="active" onclick="showTab('people', this)">people</button>
  <button onclick="showTab('travel', this)">travel</button>
  <button onclick="showTab('switzerland', this)">switzerland</button>
</nav>

<div class="board">

  <!-- PEOPLE TAB -->
  <div class="tab-content active" id="tab-people">
    <div class="trip-section">
      <div class="polaroid-row">

        <div class="polaroid pol-lg rot-m1 mt-0" onclick="openLightbox(this)">
          <div class="tape tape-tl tape-blue"></div>
          <div class="photo"><img src="people_1.jpg" alt="Ankara, Turkey"></div>
          <div class="caption">
            <span class="loc">Ankara, Turkey</span>
            <span class="when">May 2026</span>
          </div>
        </div>

      </div>
    </div>
    <div class="upload-hint">more to come</div>
  </div>

  <!-- TRAVEL TAB -->
  <div class="tab-content" id="tab-travel">
    <div class="trip-section">
      <div class="trip-label">Malaysia — December 2025</div>
      <div class="polaroid-row">

        <div class="polaroid pol-md rot-m2 mt-0" onclick="openLightbox(this)">
          <div class="tape tape-tl tape-green"></div>
          <div class="photo"><img src="travel_1.jpg" alt="Penang, Malaysia"></div>
          <div class="caption">
            <span class="loc">Penang, Malaysia</span>
            <span class="when">December 2025</span>
          </div>
        </div>

        <div class="polaroid pol-lg rot-1 mt-2 ml-2" onclick="openLightbox(this)">
          <div class="tape tape-top tape-pink"></div>
          <div class="photo"><img src="travel_2.jpg" alt="Kuala Lumpur, Malaysia"></div>
          <div class="caption">
            <span class="loc">Kuala Lumpur, Malaysia</span>
            <span class="when">December 2025</span>
          </div>
        </div>

        <div class="polaroid pol-sm rot-m1 mt-1 ml-1" onclick="openLightbox(this)">
          <div class="tape tape-tr tape-blue"></div>
          <div class="photo"><img src="travel_3.jpg" alt="Kuala Lumpur, Malaysia"></div>
          <div class="caption">
            <span class="loc">Kuala Lumpur, Malaysia</span>
            <span class="when">December 2025</span>
          </div>
        </div>

        <div class="polaroid pol-md rot-2 mt-0 ml-2" onclick="openLightbox(this)">
          <div class="tape tape-tl tape-green"></div>
          <div class="photo"><img src="travel_4.jpg" alt="Penang, Malaysia"></div>
          <div class="caption">
            <span class="loc">Penang, Malaysia</span>
            <span class="when">December 2025</span>
          </div>
        </div>

      </div>
    </div>
    <div class="upload-hint">more to come</div>
  </div>

  <!-- SWITZERLAND TAB -->
  <div class="tab-content" id="tab-switzerland">
    <div class="upload-hint">coming soon</div>
  </div>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <div class="lightbox-inner" id="lightbox-inner">
    <button class="lightbox-close" onclick="closeLightbox()">close ×</button>
    <div id="lightbox-content"></div>
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>
</div>

<script>
function showTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

function openLightbox(card) {
  const img = card.querySelector('.photo img');
  const loc  = card.querySelector('.caption .loc').textContent;
  const when = card.querySelector('.caption .when').textContent;
  const content = document.getElementById('lightbox-content');
  const capEl   = document.getElementById('lightbox-caption');

  if (img) {
    content.innerHTML = '<img src="' + img.src + '" alt="' + loc + '">';
  } else {
    content.innerHTML = '<div class="photo placeholder" style="width:600px;max-width:80vw;height:360px;max-height:70vh;"></div>';
  }

  capEl.innerHTML = '<span class="loc">' + loc + '</span><span class="when">' + when + '</span>';
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox(e) {
  if (!e || e.target === document.getElementById('lightbox') || e.target.classList.contains('lightbox-close')) {
    document.getElementById('lightbox').classList.remove('open');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});
</script>

</body>
</html>
